#@TYPE: Machine
#@NAME: rzv2h-evk-version1 machine
#@DESCRIPTION: RZ/V2H Evaluation Board Kit

SOC_FAMILY = "r9a09g057"
require conf/machine/include/arm/arch-armv8-2a.inc

# Arm Base System Architecture says v8.0+ is allowed, but FEAT_CRC32 is required
DEFAULTTUNE = "armv8-2a"

MACHINE_FEATURES = " opengles opencl hwh264enc hwh264dec hwh265enc hwh265dec"

# Install all the kernel modules into the rootfs
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

KERNEL_IMAGETYPE = "Image"
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"

IMAGE_FSTYPES ?= "wic wic.gz wic.bmap"
WKS_FILE ?= "genericarm64.wks.in"

EFI_PROVIDER ?= "${@bb.utils.contains("DISTRO_FEATURES", "systemd", "systemd-boot", "grub-efi", d)}"

# Try to bring up one physical serial console, or a virtualized serial console
SERIAL_CONSOLES ?= "115200;ttySC0"

# IPL
EXTRA_IMAGEDEPENDS += " flash-writer trusted-firmware-a firmware-pack"

WIC_INPUT_DEPENDS = "firmware-pack:do_deploy flash-writer:do_deploy"

# u-boot
UBOOT_CONFIG ??= "rzv2h-evk-ver1"
UBOOT_CONFIG[rzv2h-evk-ver1] = "rzv2h-evk-ver1_defconfig"